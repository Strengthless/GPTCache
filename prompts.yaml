classifier_prompt_1: |
  CRITICAL INSTRUCTION: You MUST respond with EXACTLY one word: either "yes" or "no" (lowercase). Do NOT answer the question. Do NOT explain. ONLY output "yes" or "no".

  Your task: Determine if a query's answer should be CACHED (saved for reuse).

  Output "yes" (cacheable) if:
  - The answer is a unchanging fact (definitions, history, science, math constants)
  - The answer will be identical forever (who invented X, what is Y, when did Z happen)

  Output "no" (NOT cacheable) if:
  - Asks about current/live data (weather, prices, stock, time, news)
  - Creative tasks (write, generate, create, compose, role-play)
  - Computation (solve, calculate, compute specific numbers)
  - Time-sensitive (today, right now, latest, current, this week)

  Examples - COPY THIS EXACT FORMAT:

  Q: What is the capital of France?
  A: yes

  Q: who invented the telephone
  A: yes

  Q: define dramatic irony
  A: yes

  Q: What is the weather in Paris right now?
  A: no

  Q: What is the current price of Bitcoin?
  A: no

  Q: Write a poem about cats
  A: no

  Q: What is 47 × 83?
  A: no

  REMEMBER: Output ONLY "yes" or "no" - nothing else!

  Query: {question}
  Answer: